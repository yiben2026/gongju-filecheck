<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件核查</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script>window.PDFLib || document.write('<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"><\/script>');</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>window.JSZip || document.write('<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"><\/script>');</script>
  <style>
    :root {
      --primary: #ff6b8a;
      --primary-light: #fff0f3;
      --primary-dark: #e85a78;
      --text: #333;
      --text-secondary: #666;
      --bg: #faf7f8;
      --card: #fff;
      --border: #ffe0e6;
      --shadow: 0 4px 20px rgba(255, 107, 138, 0.08);
      --radius: 16px;
      --ok: #4caf50;
      --ok-bg: #e8f5e9;
      --warn: #ff9800;
      --warn-bg: #fff3e0;
      --err: #f44336;
      --err-bg: #ffebee;
      --gray: #9e9e9e;
      --gray-bg: #f5f5f5;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--primary-light);
      color: var(--text);
      line-height: 1.7;
      padding: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 20px auto 40px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .header {
      background: #fff;
      color: var(--primary);
      padding: 48px 20px 32px;
      text-align: center;
    }
    .header h1 { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
    .header .subtitle { font-size: 14px; max-width: 600px; margin: 0 auto; color: var(--text-secondary); }

    .section {
      padding: 24px 32px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .section:last-of-type { margin-bottom: 0; border-bottom: none; }
    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 17px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 16px;
    }
    .step-num {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700;
      flex-shrink: 0;
    }
    .section-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 14px; }

    /* 上传区 */
    .upload-card {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 36px 24px;
      text-align: center;
      background: var(--primary-light);
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
    }
    .upload-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow); }
    .upload-card.has-file { border-color: var(--ok); background: #f1f8e9; }
    .upload-card input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .upload-icon {
      width: 56px; height: 56px;
      margin: 0 auto 10px;
      background: #fff;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .upload-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .upload-desc { font-size: 13px; color: var(--text-secondary); }
    .file-name { margin-top: 10px; font-size: 13px; color: var(--ok); font-weight: 600; word-break: break-all; }

    /* 按钮 */
    .action-bar { display: flex; gap: 12px; justify-content: center; align-items: center; }
    .btn {
      padding: 12px 28px;
      border-radius: 24px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .btn:disabled { background: #ccc !important; color: #fff !important; cursor: not-allowed; box-shadow: none !important; }
    .btn-primary { background: #b0b0b0; color: #fff; }
    .btn-primary.ready { background: var(--primary); box-shadow: 0 4px 14px rgba(255, 107, 138, 0.35); }
    .btn-primary.ready:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn-outline { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
    .btn-outline:hover { background: var(--primary-light); }
    .btn-sm { padding: 6px 16px; font-size: 13px; border-radius: 16px; }

    /* 进度面板 */
    .panel { background: var(--primary-light); border-radius: 12px; padding: 16px 18px; margin-top: 16px; font-size: 13px; display: none; }
    .panel.show { display: block; }
    .panel-title { font-weight: 700; color: var(--primary-dark); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .progress-wrap { background: #fff; border-radius: 10px; overflow: hidden; height: 22px; margin-bottom: 10px; border: 1px solid var(--border); }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #ff8fa3 0%, var(--primary) 100%);
      width: 0;
      transition: width 0.4s ease;
      text-align: center;
      color: #fff;
      font-size: 12px;
      line-height: 22px;
      font-weight: 600;
    }
    .log {
      max-height: 160px;
      overflow-y: auto;
      background: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.8;
      color: #555;
      border: 1px solid var(--border);
    }
    .log .ok { color: var(--ok); }
    .log .warn { color: var(--warn); }
    .log .err { color: var(--err); }
    .log .info { color: var(--primary-dark); }

    /* 汇总卡片 */
    .summary-cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .summary-card {
      flex: 1;
      min-width: 120px;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    .summary-card .num { font-size: 28px; font-weight: 700; }
    .summary-card .label { font-size: 12px; margin-top: 2px; }
    .summary-card.total { background: var(--primary-light); color: var(--primary-dark); }
    .summary-card.ok { background: var(--ok-bg); color: var(--ok); }
    .summary-card.err { background: var(--err-bg); color: var(--err); }
    .summary-card.warn { background: var(--warn-bg); color: var(--warn); }
    .summary-card.gray { background: var(--gray-bg); color: var(--gray); }

    /* 结果表格 */
    .table-wrap { margin-top: 14px; overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); display: none; }
    .table-wrap.show { display: block; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
    thead th {
      background: var(--primary);
      color: #fff;
      padding: 12px 10px;
      text-align: left;
      font-weight: 600;
      white-space: nowrap;
    }
    tbody td { padding: 12px 10px; border-bottom: 1px solid #f0f0f0; vertical-align: top; color: #444; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--primary-light); }
    .verdict { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .verdict-ok { background: var(--ok-bg); color: var(--ok); }
    .verdict-err { background: var(--err-bg); color: var(--err); }
    .verdict-warn { background: var(--warn-bg); color: var(--warn); }
    .verdict-gray { background: var(--gray-bg); color: var(--gray); }
    .source-link { display: block; color: var(--primary-dark); text-decoration: none; font-size: 12px; margin-bottom: 3px; }
    .source-link:hover { text-decoration: underline; }
    .source-unverified { color: #999; font-size: 11px; margin-right: 2px; }

    .footer { padding: 16px; text-align: center; font-size: 12px; color: var(--text-secondary); }

    @media (max-width: 768px) {
      .header { padding: 24px 16px; }
      .section { padding: 18px 16px; }
      .action-bar { flex-direction: column; }
      .btn { width: 100%; }
      .summary-cards { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="header">
  <h1>文件核查</h1>
  <div class="subtitle">上传试卷 PDF 或 Word，自动提取文本并联网核查古诗文、字词、数据、出处等内容</div>
</div>

<div class="container">
  <!-- 步骤1：上传文件 -->
  <div class="section">
    <div class="section-title"><span class="step-num">1</span>上传文件</div>
    <div class="upload-card" id="pdfUploadCard">
      <input type="file" id="pdfInput" accept=".pdf,.docx,.doc">
      <div class="upload-icon">📄</div>
      <div class="upload-title">上传试卷 PDF / Word</div>
      <div class="upload-desc">支持 PDF、Word（docx），点击或拖拽到此处</div>
      <div class="file-name" id="pdfFileName"></div>
    </div>
  </div>

  <!-- 步骤2：开始核查 -->
  <div class="section">
    <div class="section-title"><span class="step-num">2</span>开始核查</div>
    <div class="section-desc">点击按钮后自动提取文本、识别可核查内容，并联网搜索权威网站逐条比对。</div>
    <div class="action-bar">
      <button class="btn btn-primary" id="checkBtn" disabled>开始核查</button>
      <button class="btn btn-outline" id="resetBtn">重置</button>
    </div>

    <!-- 进度面板 -->
    <div class="panel" id="progressPanel">
      <div class="panel-title"><span>核查进度</span></div>
      <div class="progress-wrap"><div class="progress-bar" id="progressBar">0%</div></div>
      <div class="log" id="logArea"></div>
    </div>

    <!-- 结果面板 -->
    <div class="panel" id="resultPanel">
      <div class="panel-title">
        <span>核查结果（<span id="itemCount">0</span> 项）</span>
      </div>
      <!-- 汇总 -->
      <div class="summary-cards" id="summaryCards" style="display:none;">
        <div class="summary-card total"><div class="num" id="sumTotal">0</div><div class="label">核查总数</div></div>
        <div class="summary-card ok"><div class="num" id="sumOk">0</div><div class="label">内容无误</div></div>
        <div class="summary-card err"><div class="num" id="sumErr">0</div><div class="label">存在错误</div></div>
        <div class="summary-card warn"><div class="num" id="sumWarn">0</div><div class="label">存疑待商</div></div>
        <div class="summary-card gray"><div class="num" id="sumUnknown">0</div><div class="label">无法核实</div></div>
      </div>
      <!-- 批注导出 -->
      <div class="action-bar" style="margin-bottom:14px;">
        <button class="btn btn-primary" id="annotateBtn" disabled>📝 生成带批注的新文件</button>
        <span style="font-size:12px; color:var(--text-secondary);">把核查结果以批注形式标注到原文件上（PDF / Word）</span>
      </div>
      <!-- 表格 -->
      <div class="table-wrap" id="resultTableWrap">
        <table>
          <thead>
            <tr>
              <th style="width:40px;">#</th>
              <th style="width:100px;">页码/题号</th>
              <th>核查内容</th>
              <th style="width:90px;">结论</th>
              <th>核查依据与链接</th>
              <th>说明/修改建议</th>
            </tr>
          </thead>
          <tbody id="resultTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="footer">
    文件核查 · PDF/Word 提取 + 联网搜索 + 文本比对 · © 2026
  </div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // 自动适配：本地、Render 部署、iframe 嵌入都可用
  const SERVER_URL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'http://localhost:3456'
    : '';

  let selectedFile = null;
  let checkResults = [];   // 保存核查结果，用于生成批注文件
  let annotateReady = false;

  const $ = id => document.getElementById(id);

  // ===== 提取文本（PDF / Word） =====
  async function extractTextFromFile(file) {
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    if (ext === 'pdf') {
      return extractPdfText(file);
    }
    if (ext === 'docx') {
      return extractDocxText(file);
    }
    throw new Error('暂不支持的文件格式：' + ext + '，请使用 PDF 或 Word（docx）');
  }

  async function extractPdfText(file) {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    const totalPages = pdf.numPages;
    const pages = [];
    for (let i = 1; i <= totalPages; i++) {
      const page = await pdf.getPage(i);
      const textContent = await page.getTextContent();
      const pageText = textContent.items.map(item => item.str).join('');
      pages.push({ pageNum: i, text: pageText });
    }
    return pages;
  }

  async function extractDocxText(file) {
    const arrayBuffer = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer });
    if (result.messages && result.messages.length) {
      console.log('mammoth messages:', result.messages);
    }
    const text = result.value || '';
    return [{ pageNum: '文档', text }];
  }

  // ===== 工具函数 =====
  function setProgress(pct, text) {
    $('progressBar').style.width = pct + '%';
    $('progressBar').textContent = text || (pct + '%');
  }
  function log(msg, type = '') {
    const line = document.createElement('div');
    line.className = type;
    line.textContent = msg;
    $('logArea').appendChild(line);
    $('logArea').scrollTop = $('logArea').scrollHeight;
  }
  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function verdictTag(v) {
    const map = {
      '内容无误': ['verdict-ok', '✓ 无误'],
      '存在错误': ['verdict-err', '✗ 错误'],
      '存疑待商': ['verdict-warn', '⚠ 存疑'],
      '无法核实': ['verdict-gray', '? 无法核实'],
    };
    const [cls, label] = map[v] || ['verdict-gray', v];
    return `<span class="verdict ${cls}">${label}</span>`;
  }

  // ===== 上传文件 =====
  $('pdfInput').addEventListener('change', e => {
    selectedFile = e.target.files[0];
    if (!selectedFile) return;
    $('pdfFileName').textContent = selectedFile.name;
    $('pdfUploadCard').classList.add('has-file');
    $('checkBtn').disabled = false;
    $('checkBtn').classList.add('ready');
  });

  // 拖拽
  const uploadCard = $('pdfUploadCard');
  uploadCard.addEventListener('dragover', e => { e.preventDefault(); uploadCard.style.borderColor = '#ff6b8a'; });
  uploadCard.addEventListener('dragleave', e => { e.preventDefault(); uploadCard.style.borderColor = ''; });
  uploadCard.addEventListener('drop', e => {
    e.preventDefault();
    uploadCard.style.borderColor = '';
    $('pdfInput').files = e.dataTransfer.files;
    $('pdfInput').dispatchEvent(new Event('change'));
  });

  // ===== 开始核查 =====
  $('checkBtn').addEventListener('click', async () => {
    if (!selectedFile) return;

    $('checkBtn').disabled = true;
    $('checkBtn').classList.remove('ready');
    $('annotateBtn').disabled = true;
    annotateReady = false;
    checkResults = [];
    $('progressPanel').classList.add('show');
    $('resultPanel').classList.remove('show');
    $('resultTableWrap').classList.remove('show');
    $('summaryCards').style.display = 'none';
    $('logArea').innerHTML = '';
    $('resultTable').innerHTML = '';

    try {
      setProgress(2, '2%');
      const ext = (selectedFile.name.split('.').pop() || '').toLowerCase();
      log(`正在读取 ${ext.toUpperCase()} 文件...`, 'info');

      const pages = await extractTextFromFile(selectedFile);
      log(`文本提取完成，共 ${pages.length} 页/段`, 'ok');

      setProgress(22, '22%');
      log('正在发送文本到核查服务...', 'info');
      log('服务端正在识别可核查内容并联网搜索...', 'info');

      const response = await fetch(SERVER_URL + '/api/check', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pages }),
      });

      if (!response.ok) {
        throw new Error('服务端返回错误: ' + response.status);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let totalItems = 0;
      let checkedItems = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          let data;
          try { data = JSON.parse(line.slice(6)); } catch { continue; }

          if (data.type === 'start') {
            totalItems = data.count;
            log(`识别到 ${totalItems} 项可核查内容，开始联网核查...`, 'info');
            setProgress(25, `25% (0/${totalItems})`);
            const rows = data.items.map(it => `
              <tr id="row-${it.idx}" class="pending">
                <td>${it.idx}</td>
                <td>${it.page}</td>
                <td>${escapeHtml(it.content)}</td>
                <td><span class="verdict verdict-gray">等待中...</span></td>
                <td>—</td>
                <td>—</td>
              </tr>
            `).join('');
            $('resultTable').innerHTML = rows;
            $('resultTableWrap').classList.add('show');
            $('resultPanel').classList.add('show');
            $('itemCount').textContent = totalItems;

          } else if (data.type === 'result') {
            checkedItems++;
            const r = data.result;
            const pct = 25 + Math.round((checkedItems / totalItems) * 70);
            setProgress(pct, `${pct}% (${checkedItems}/${totalItems})`);

            // 收集结果，供生成批注文件
            checkResults.push({
              idx: r.idx,
              page: r.page,
              content: r.content || '',
              verdict: r.verdict || '无法核实',
              sources: r.sources || [],
              notes: r.notes || '',
              suggestion: r.suggestion || ''
            });

            const sourceLinks = (r.sources || []).map(s => {
              const unverified = s.verified === false ? '<span class="source-unverified">[未验证]</span> ' : '';
              return `<a class="source-link" href="${escapeHtml(s.url)}" target="_blank" rel="noopener">${unverified}${escapeHtml(s.title)}</a>`;
            }).join('') || '—';

            const notes = r.notes ? escapeHtml(r.notes) : '—';
            const suggestion = r.suggestion ? `<br><b style="color:var(--primary-dark);">建议：</b>${escapeHtml(r.suggestion)}` : '';

            const row = document.getElementById(`row-${r.idx}`);
            if (row) {
              row.classList.remove('pending');
              row.cells[3].innerHTML = verdictTag(r.verdict);
              row.cells[4].innerHTML = sourceLinks;
              row.cells[5].innerHTML = notes + suggestion;
            }

            const logType = r.verdict === '内容无误' ? 'ok' :
                           r.verdict === '存在错误' ? 'err' :
                           r.verdict === '存疑待商' ? 'warn' : '';
            log(`  [${checkedItems}/${totalItems}] ${r.page} ${r.content.substring(0, 25)} → ${r.verdict}`, logType);

          } else if (data.type === 'done') {
            const s = data.summary;
            setProgress(100, '100%');
            log(`核查完成！正确 ${s.ok} | 错误 ${s.error} | 存疑 ${s.doubt} | 无法核实 ${s.unknown}`, 'ok');

            $('sumTotal').textContent = s.total;
            $('sumOk').textContent = s.ok;
            $('sumErr').textContent = s.error;
            $('sumWarn').textContent = s.doubt;
            $('sumUnknown').textContent = s.unknown;
            $('summaryCards').style.display = 'flex';

            // 核查完成，允许生成批注文件
            annotateReady = true;
            $('annotateBtn').disabled = false;

          } else if (data.type === 'error') {
            log('服务端错误: ' + data.message, 'err');
          }
        }
      }
    } catch (err) {
      log('错误: ' + err.message, 'err');
      if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
        log('提示：核查服务暂时不可用，请稍后重试或刷新页面。', 'warn');
      }
    } finally {
      $('checkBtn').disabled = false;
      $('checkBtn').classList.add('ready');
    }
  });

  // ===== 生成带批注的新文件 =====
  function buildAnnotationText(r) {
    const lines = [];
    lines.push(`【结论】${r.verdict}`);
    lines.push(`【核查内容】${r.content}`);
    if (r.sources && r.sources.length) {
      lines.push('【核查依据】');
      r.sources.forEach((s, i) => {
        lines.push(`${i + 1}. ${s.title}${s.verified === false ? '（未验证）' : ''} — ${s.url}`);
      });
    }
    if (r.notes) lines.push(`【说明】${r.notes}`);
    if (r.suggestion) lines.push(`【建议】${r.suggestion}`);
    return lines.join('\n');
  }

  function downloadBlob(blob, filename) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  // ---- PDF：在原 PDF 对应页面加文本批注 ----
  async function annotatePdf() {
    const arrayBuffer = await selectedFile.arrayBuffer();
    const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
    const pageCount = pdfDoc.getPageCount();
    const perPageCount = {};
    let added = 0, skipped = 0;

    for (const r of checkResults) {
      const pageNum = parseInt(r.page, 10);
      if (isNaN(pageNum) || pageNum < 1 || pageNum > pageCount) { skipped++; continue; }
      const page = pdfDoc.getPage(pageNum - 1);
      perPageCount[pageNum] = (perPageCount[pageNum] || 0) + 1;
      const size = 24;
      const x = 18;
      const y = page.getHeight() - 40 - (perPageCount[pageNum] - 1) * (size + 4);

      // 手动构造 PDF 文本批注（pdf-lib 无内置 createAnnotation，需写底层对象）
      const annotObj = pdfDoc.context.obj({
        Type: 'Annot',
        Subtype: 'Text',
        Rect: [x, y, x + size, y + size],
        Contents: buildAnnotationText(r),
        T: `[${r.verdict}] ${r.content.substring(0, 20)}`,
        F: 4,               // 打印时显示
        C: [1, 0.42, 0.54], // 粉色图标
        Name: 'Comment',
      });
      const annotRef = pdfDoc.context.register(annotObj);
      const annots = page.node.Annots() || pdfDoc.context.obj([]);
      annots.push(annotRef);
      page.node.set(PDFLib.PDFName.of('Annots'), annots);
      added++;
    }

    if (added === 0) { throw new Error('未能定位核查内容到对应页码，无法生成批注'); }

    const bytes = await pdfDoc.save();
    const blob = new Blob([bytes], { type: 'application/pdf' });
    const name = selectedFile.name.replace(/\.pdf$/i, '') + '_核查批注.pdf';
    downloadBlob(blob, name);
    return { added, skipped };
  }

  // ---- Word（docx）：在原文档对应文本位置插入批注 ----
  function decodeXml(s) {
    return s
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')
      .replace(/&quot;/g, '"').replace(/&apos;/g, "'")
      .replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(parseInt(d, 10)));
  }
  function escapeXml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
  }
  // 多行文本 → w:p / w:r / w:br 结构
  function textToRuns(text) {
    const lines = (text || '').split('\n');
    return lines.map((line, i) => {
      const run = `<w:r><w:t xml:space="preserve">${escapeXml(line)}</w:t></w:r>`;
      return i < lines.length - 1 ? run + '<w:r><w:br/></w:r>' : run;
    }).join('');
  }

  function makeCommentNode(id, text) {
    return `<w:comment w:id="${id}" w:author="文件核查" w:date="${new Date().toISOString()}" w:initials="FH"><w:p>${textToRuns(text)}</w:p></w:comment>`;
  }

  async function annotateDocx() {
    const arrayBuffer = await selectedFile.arrayBuffer();
    const zip = await JSZip.loadAsync(arrayBuffer);

    let documentXml = await zip.file('word/document.xml').async('string');
    if (!documentXml) { throw new Error('未找到 word/document.xml，不是有效的 docx 文件'); }

    // 1) 收集所有 w:t 文本片段，构建全文索引
    const spans = [];
    const re = /<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>/g;
    let m;
    while ((m = re.exec(documentXml)) !== null) {
      const text = decodeXml(m[1]);
      spans.push({ start: m.index, end: m.index + m[0].length, text });
    }
    let fullText = '';
    const charToSpan = [];
    for (let i = 0; i < spans.length; i++) {
      for (let k = 0; k < spans[i].text.length; k++) charToSpan.push(i);
      fullText += spans[i].text;
    }

    // 2) 逐条定位核查内容，插入批注标记
    // 先确定已有 comments.xml 的最大批注 id（若存在），新批注从其后编号，保证两处 id 一致
    let nextId = 0;
    const existingComments = zip.file('word/comments.xml');
    if (existingComments) {
      const oldComments = await existingComments.async('string');
      const idRe = /w:id="(\d+)"/g;
      let im;
      while ((im = idRe.exec(oldComments)) !== null) nextId = Math.max(nextId, parseInt(im[1], 10) + 1);
    }
    // 收集所有 run（<w:r>）开始/结束标签位置，批注标记必须插在 run 之外
    const runStarts = [];
    const runEnds = [];
    {
      const ro = /<w:r(?:\s[^>]*)?>/g;
      let rm;
      while ((rm = ro.exec(documentXml)) !== null) runStarts.push(rm.index);
      const rc = /<\/w:r>/g;
      while ((rm = rc.exec(documentXml)) !== null) runEnds.push(rm.index);
    }
    function runRangeOf(spanPos) {
      // 找到包含该位置的 run：最后一个 start <= pos 的 run
      let i = -1;
      for (let k = 0; k < runStarts.length; k++) { if (runStarts[k] <= spanPos) i = k; else break; }
      if (i < 0 || i >= runEnds.length) return null;
      return { start: runStarts[i], end: runEnds[i] + 6 }; // +6 = '</w:r>'.length
    }

    let added = 0, skipped = 0;
    const commentNodes = [];
    const insertions = [];  // { start, end, startMark, endMark }，先收集后从后往前插入

    for (const r of checkResults) {
      const needle = (r.content || '').trim();
      if (!needle) { skipped++; continue; }
      let idx = fullText.indexOf(needle);
      if (idx < 0) {
        // 折叠空白后再尝试匹配
        const foldedNeedle = needle.replace(/\s+/g, ' ');
        const foldedFull = fullText.replace(/\s+/g, ' ');
        const ci = foldedFull.indexOf(foldedNeedle);
        if (ci >= 0) {
          // 把折叠全文中的位置映射回原全文：数原文本前 ci 个非空白字符
          let count = 0, j = 0;
          for (; j < fullText.length && count < ci; j++) if (!/\s/.test(fullText[j])) count++;
          // 再匹配折叠 needle 的首段
          const firstSeg = foldedNeedle.split(' ')[0];
          idx = fullText.indexOf(firstSeg, j);
        }
        if (idx < 0) {
          const noSpace = needle.replace(/\s+/g, '');
          const fullNoSpace = fullText.replace(/\s+/g, '');
          const ni = fullNoSpace.indexOf(noSpace);
          if (ni >= 0) {
            // 用 noSpace 在 fullNoSpace 的位置映射回 fullText：数前 ni 个非空白字符的偏移
            let count = 0, j = 0;
            for (; j < fullText.length && count < ni; j++) if (!/\s/.test(fullText[j])) count++;
            idx = j;
          }
        }
      }
      if (idx < 0) { skipped++; continue; }

      const sIdx = charToSpan[idx];
      const eIdx = charToSpan[idx + needle.length - 1];
      // 跨段落的不处理（批注只挂段落内）
      const between = documentXml.slice(spans[sIdx].start, spans[eIdx].end);
      if (/<w:p[ >]/.test(between) || /<\/w:p>/.test(between)) { skipped++; continue; }

      const sRun = runRangeOf(spans[sIdx].start);
      const eRun = runRangeOf(spans[eIdx].end - 1);
      if (!sRun || !eRun) { skipped++; continue; }

      const id = nextId++;
      const startMark = `<w:commentRangeStart w:id="${id}"/>`;
      const endMark = `<w:commentRangeEnd w:id="${id}"/><w:r><w:rPr><w:rStyle w:val="CommentReference"/></w:rPr><w:commentReference w:id="${id}"/></w:r>`;

      insertions.push({ start: sRun.start, end: eRun.end, startMark, endMark });
      commentNodes.push(makeCommentNode(id, buildAnnotationText(r)));
      added++;
    }

    if (added === 0) { throw new Error('未能定位任何核查内容到原文中，无法生成批注'); }

    // 所有插入点拆成独立操作，按位置从后往前逐个插入，避免坐标偏移
    const ops = [];
    for (const ins of insertions) {
      ops.push({ pos: ins.start, mark: ins.startMark });
      ops.push({ pos: ins.end, mark: ins.endMark });
    }
    ops.sort((a, b) => b.pos - a.pos);
    for (const op of ops) {
      documentXml = documentXml.slice(0, op.pos) + op.mark + documentXml.slice(op.pos);
    }

    // 3) 写入/合并 word/comments.xml
    let commentsXml = '';
    if (existingComments) {
      let old = await existingComments.async('string');
      old = old.replace(/<\/w:comments>\s*$/, '');
      commentsXml = old + '\n' + commentNodes.join('\n') + '\n</w:comments>';
    } else {
      commentsXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<w:comments xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">\n' +
        commentNodes.join('\n') + '\n</w:comments>';
    }
    zip.file('word/comments.xml', commentsXml);

    // 4) 更新 [Content_Types].xml
    const ctName = '[Content_Types].xml';
    let ctXml = await zip.file(ctName).async('string');
    if (ctXml.indexOf('wordprocessingml.comments+xml') < 0) {
      ctXml = ctXml.replace(/<\/Types>/, '<Override PartName="/word/comments.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.comments+xml"/></Types>');
      zip.file(ctName, ctXml);
    }

    // 5) 更新 word/_rels/document.xml.rels
    const relsName = 'word/_rels/document.xml.rels';
    let relsXml = await zip.file(relsName).async('string');
    if (relsXml.indexOf('relationships/comments') < 0) {
      const idRe = /Id="rId(\d+)"/g;
      let maxRid = 0, im;
      while ((im = idRe.exec(relsXml)) !== null) maxRid = Math.max(maxRid, parseInt(im[1], 10));
      relsXml = relsXml.replace(/<\/Relationships>/, `<Relationship Id="rId${maxRid + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/comments" Target="comments.xml"/></Relationships>`);
      zip.file(relsName, relsXml);
    }

    // 6) 重新打包下载
    const blob = await zip.generateAsync({
      type: 'blob',
      mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      compression: 'DEFLATE'
    });
    const name = selectedFile.name.replace(/\.docx$/i, '') + '_核查批注.docx';
    downloadBlob(blob, name);
    return { added, skipped };
  }

  // ===== 生成批注文件按钮 =====
  $('annotateBtn').addEventListener('click', async () => {
    if (!annotateReady || !selectedFile || checkResults.length === 0) return;
    const btn = $('annotateBtn');
    btn.disabled = true;
    log('正在生成带批注的新文件...', 'info');
    try {
      const ext = (selectedFile.name.split('.').pop() || '').toLowerCase();
      let res;
      if (ext === 'pdf') {
        res = await annotatePdf();
      } else if (ext === 'docx') {
        res = await annotateDocx();
      } else {
        throw new Error('当前文件格式不支持生成批注，请使用 PDF 或 Word（docx）');
      }
      log(`批注文件生成完成：成功标注 ${res.added} 条，跳过 ${res.skipped} 条（未定位到原文）`, 'ok');
    } catch (err) {
      log('生成批注失败: ' + err.message, 'err');
    } finally {
      btn.disabled = false;
    }
  });

  // ===== 重置 =====
  $('resetBtn').addEventListener('click', () => {
    selectedFile = null;
    checkResults = [];
    annotateReady = false;
    $('pdfInput').value = '';
    $('pdfFileName').textContent = '';
    $('pdfUploadCard').classList.remove('has-file');
    $('checkBtn').disabled = true;
    $('checkBtn').classList.remove('ready');
    $('annotateBtn').disabled = true;
    $('progressPanel').classList.remove('show');
    $('resultPanel').classList.remove('show');
    $('resultTableWrap').classList.remove('show');
    $('summaryCards').style.display = 'none';
    setProgress(0, '0%');
  });
</script>
</body>
</html>
